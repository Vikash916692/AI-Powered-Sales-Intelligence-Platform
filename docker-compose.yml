services:
  mysql:
    image: mysql:8.4
    container_name: sales-intelligence-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sales_intelligence
      MYSQL_USER: vikash
      MYSQL_PASSWORD: vikash@7014
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: sales-intelligence-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sales-intelligence-api
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://vikash:vikash@7014@mysql:3306/sales_intelligence
      - REDIS_URL=redis://redis:6379/0

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: sales-intelligence-dashboard
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://backend:8000/api/v1

volumes:
  mysql_data: