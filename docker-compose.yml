services:
  mysql:
    image: mysql:8.4
    container_name: sales-intelligence-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sales_intelligence
      MYSQL_USER: vikash
      MYSQL_PASSWORD: vikash@7014

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: